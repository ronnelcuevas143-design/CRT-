<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iFVG Short Scanner + Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0b0f17;color:#e5e7eb;padding:12px}
h1{font-size:18px;margin:0 0 10px}
.panel{background:#121826;border:1px solid #1f2a3d;border-radius:12px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
label{font-size:12px;color:#94a3b8;display:block;margin:0 0 3px}
input,select{width:100%;background:#0b0f17;color:#e5e7eb;border:1px solid #1f2a3d;border-radius:8px;padding:9px 6px;font-size:14px}
.chk{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:14px}
.chk input{width:20px;height:20px;padding:0}
.btnrow{display:flex;gap:8px;margin-top:10px}
button{padding:11px 16px;border:0;border-radius:8px;background:#3b82f6;color:#fff;font-size:15px;font-weight:600}
button.sec{background:#1f2a3d;color:#e5e7eb}
button:disabled{opacity:.5}
#prog{height:6px;background:#1f2a3d;border-radius:4px;margin-top:10px;overflow:hidden}
#prog i{display:block;height:100%;width:0;background:#3b82f6;transition:width .2s}
#status{font-size:13px;color:#94a3b8;margin-top:8px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pill{padding:5px 10px;border-radius:999px;background:#0b0f17;border:1px solid #1f2a3d;font-size:13px;font-weight:700}
.pill.w{color:#22c55e;border-color:#166534}.pill.l{color:#ef4444;border-color:#7f1d1d}.pill.o{color:#eab308;border-color:#713f12}
table.rr{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}table.rr th{color:#94a3b8;font-weight:600;text-align:right;padding:4px 2px;border-bottom:1px solid #1f2a3d}table.rr td{text-align:right;padding:5px 2px}table.rr th:first-child,table.rr td:first-child{text-align:left}table.rr tr.best td{background:#16653422;font-weight:700}
.sub{font-size:12px;color:#94a3b8;line-height:1.7}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tab{white-space:nowrap;padding:9px 14px;border-radius:999px;background:#121826;border:1px solid #1f2a3d;color:#e5e7eb;font-size:14px;font-weight:700}
.tab.on{border-color:#3b82f6;color:#60a5fa}
.card{background:#121826;border:1px solid #1f2a3d;border-left:4px solid #64748b;border-radius:12px;padding:12px;margin-bottom:10px}
.card.confirmed{border-left-color:#ef4444}.card.developing{border-left-color:#eab308}.card.watching{border-left-color:#64748b}
.card.win{border-left-color:#22c55e}.card.loss{border-left-color:#ef4444}.card.open{border-left-color:#eab308}.card.expired{opacity:.55}
.hd{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sym{font-size:18px;font-weight:700}.sym span{color:#94a3b8;font-weight:400}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#1f2a3d;color:#cbd5e1}
.tag.red{background:#7f1d1d55;color:#f87171}.tag.green{background:#16653455;color:#4ade80}.tag.yel{background:#71350055;color:#facc15}.tag.pur{background:#4c1d9555;color:#c4b5fd}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:13px}
.kv div{display:flex;justify-content:space-between;gap:6px;color:#94a3b8}
.kv b{color:#e5e7eb;font-weight:600;text-align:right}
.note{font-size:12px;color:#94a3b8;margin-top:8px}
a.btn{display:block;text-align:center;margin-top:10px;padding:10px;border-radius:8px;background:#172554;color:#93c5fd;text-decoration:none;font-weight:700;font-size:14px}
.empty{padding:16px;text-align:center;color:#94a3b8}
</style>
</head>
<body>
<h1>iFVG Short Scanner</h1>

<div class="panel">
  <div class="grid">
    <div><label>Coins</label><select id="coinsSel"><option value="0">Lahat</option><option value="50">Top 50 volume</option><option value="100">Top 100 volume</option><option value="200">Top 200 volume</option></select></div>
    <div><label>Swing strength</label><select id="swing"><option>1</option><option selected>2</option><option>3</option><option>4</option></select></div>
    <div><label>Break by</label><select id="breakBy"><option value="wick">Wick (high)</option><option value="body">Body (close)</option></select></div>
    <div><label>Min 24h volume (USDT)</label><select id="minVol"><option value="0">Walang filter</option><option value="10000000">10M+</option><option value="50000000">50M+</option><option value="100000000">100M+</option></select></div>
    <div><label>Lookback (candles)</label><input id="lookback" type="number" value="50"></div>
    <div><label>Near top (% ng range)</label><input id="nearTop" type="number" value="10"></div>
    <div><label>Developing range %</label><input id="devRange" type="number" step="0.05" value="0.30"></div>
    <div><label>Max age (candles)</label><input id="maxAge" type="number" value="30"></div>
    <div><label>Confirmed valid (candles)</label><input id="confValid" type="number" value="6"></div>
  </div>
  <div class="grid" style="margin-top:8px;grid-template-columns:1fr 1fr">
    <div><label>Direction</label><select id="dirSel"><option value="auto">Auto (sundin ang BTC Daily)</option><option value="short">Short lang</option><option value="long">Long lang</option><option value="both">Short + Long</option></select></div>
    <div><label>BTC Daily bias rule</label><select id="biasRule"><option value="close">Close vs previous close</option><option value="low">Close beyond previous low/high</option></select></div>
  </div>
  <div class="chk"><input type="checkbox" id="btcGate" checked><span>Sundin ang BTC Daily bias (Short/Long lang)</span></div>
  <div class="chk"><input type="checkbox" id="autoScan"><span>Auto-scan kada 5m close</span></div>
  <div class="chk"><input type="checkbox" id="alertOn" checked><span>Alert (beep/vibrate)</span></div>
  <div class="btnrow"><button id="go">Scan</button><button id="upd" class="sec">Update results</button></div>
  <div id="prog"><i></i></div>
  <div id="status"></div>
</div>

<div class="panel">
  <div class="grid" style="grid-template-columns:1fr 1fr 1fr">
    <div><label>Bilangin WIN kapag umabot sa RR</label><select id="winThr"><option value="1">1:1</option><option value="2" selected>1:2</option><option value="3">1:3</option><option value="4">1:4 (full TP)</option></select></div>
    <div><label>Stats para sa</label><select id="statGrade"><option value="">Lahat</option><option value="A+">A+ (may div)</option><option value="B">B (walang div)</option></select></div>
    <div><label>Direction</label><select id="statDir"><option value="">Lahat</option><option value="short">Short</option><option value="long">Long</option></select></div>
  </div>
  <div id="statsBox" style="margin-top:10px"></div>
</div>
<div id="biasBox"></div>
<div class="tabs" id="tabs"></div>
<div id="list"></div>

<script>
// ===== pure logic =====
const M5 = 300, D1 = 86400, FAPI = 'https://fapi.binance.com', SPOT = 'https://data-api.binance.vision';
const closedOnly = (arr, step) => { const now = Date.now()/1000; return arr.filter(x => x.t + step <= now); };

async function jget(url){ const r = await fetch(url); if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }
async function klines(sym, interval, limit, startMs){
  const q = `symbol=${sym}&interval=${interval}&limit=${limit}` + (startMs ? `&startTime=${startMs}` : '');
  let err;
  for(const u of [`${FAPI}/fapi/v1/klines?${q}`, `${SPOT}/api/v3/klines?${q}`]){
    try{ const j = await jget(u); return j.map(k => ({t:Math.floor(k[0]/1000), o:+k[1], h:+k[2], l:+k[3], c:+k[4]})); }
    catch(e){ err = e; }
  }
  throw err;
}
async function klinesFrom(sym, startSec){
  let out = [], cur = startSec*1000;
  for(let p=0;p<8;p++){
    const k = await klines(sym, '5m', 1500, cur);
    if(!k.length) break;
    out = out.concat(k);
    if(k.length < 1500) break;
    cur = (k[k.length-1].t + M5) * 1000;
  }
  return closedOnly(out, M5);
}
async function universe(){
  let rows;
  try{ rows = await jget(FAPI + '/fapi/v1/ticker/24hr'); }
  catch(e){ rows = await jget(SPOT + '/api/v3/ticker/24hr'); }
  return rows.filter(r => /USDT$/.test(r.symbol) && !r.symbol.includes('_')).map(r => ({sym:r.symbol, vol:+r.quoteVolume}));
}
async function btcBias(rule){
  const d = closedOnly(await klines('BTCUSDT', '1d', 6), D1);
  const l = d[d.length-1], p = d[d.length-2];
  let state = 'neutral';
  if(rule === 'low'){ if(l.c < p.l) state = 'bear'; else if(l.c > p.h) state = 'bull'; }
  else { if(l.c < p.c) state = 'bear'; else if(l.c > p.c) state = 'bull'; }
  return {state, l, p};
}
function rsi(c, n){
  const r = new Array(c.length).fill(null);
  if(c.length <= n) return r;
  let g=0, l=0;
  for(let i=1;i<=n;i++){ const d=c[i]-c[i-1]; d>=0 ? g+=d : l-=d; }
  g/=n; l/=n;
  r[n] = l===0 ? 100 : 100-100/(1+g/l);
  for(let i=n+1;i<c.length;i++){
    const d=c[i]-c[i-1];
    g=(g*(n-1)+(d>0?d:0))/n; l=(l*(n-1)+(d<0?-d:0))/n;
    r[i] = l===0 ? 100 : 100-100/(1+g/l);
  }
  return r;
}

// Break candle j = middle candle of a bullish FVG; it breaks the most recent swing high.
const flipSetup = o => {
  const r = Object.assign({}, o, {dir:'long', price:-o.price, swingHigh:-o.swingHigh, fvgTop:-o.fvgBottom, fvgBottom:-o.fvgTop,
    rsiA:o.rsiA == null ? null : 100 - o.rsiA, rsiB:o.rsiB == null ? null : 100 - o.rsiB});
  if(o.entry != null){ r.entry = -o.entry; r.sl = -o.sl; r.tp = -o.tp; }
  return r;
};
// dir 'short': swing-high break + bullish FVG + close below it.  dir 'long' is the exact mirror (prices negated).
function detect(sym, raw0, cfg, dir){
  dir = dir || 'short';
  const raw = dir === 'long' ? raw0.map(x => ({t:x.t, o:-x.o, h:-x.l, l:-x.h, c:-x.c})) : raw0;
  const fin = o => dir === 'long' ? flipSetup(o) : Object.assign(o, {dir:'short'});
  const m = closedOnly(raw, M5), n = m.length, s = cfg.swing;
  if(n < cfg.lookback + 2*s + 20) return null;
  const rs = rsi(m.map(x => x.c), 14);
  const isPivot = i => {
    if(i - s < 0 || i + s >= n) return false;
    for(let q=1;q<=s;q++) if(m[i].h <= m[i-q].h || m[i].h <= m[i+q].h) return false;
    return true;
  };
  for(let j=n-2; j>=Math.max(s+2, n-1-cfg.maxAge); j--){
    // most recent confirmed pivot high before j
    let p = -1;
    for(let q=j-s-1; q>=Math.max(s, j-cfg.lookback); q--){ if(isPivot(q)){ p = q; break; } }
    if(p < 0) continue;
    const L = m[p].h;
    const brk = cfg.breakBy === 'body' ? m[j].c > L : m[j].h > L;
    if(!brk) continue;
    let early = false;                                   // j must be the first break
    for(let q=p+1;q<j;q++){ if((cfg.breakBy === 'body' ? m[q].c : m[q].h) > L){ early = true; break; } }
    if(early) continue;
    if(!(m[j+1].l > m[j-1].h)) continue;                 // bullish FVG on the break candle
    // swing high must be near the top of the lookback range
    let hi = -Infinity, lo = Infinity;
    for(let q=Math.max(0,j-cfg.lookback); q<j; q++){ hi = Math.max(hi, m[q].h); lo = Math.min(lo, m[q].l); }
    if(!(L >= hi - (cfg.near/100)*(hi-lo))) continue;

    const top = m[j+1].l, bottom = m[j-1].h;
    let kc = -1;
    for(let k=j+2;k<n;k++){ if(m[k].c < bottom){ kc = k; break; } }   // body close below FVG = iFVG
    const end = kc >= 0 ? kc : n-1;
    let B = j;
    for(let q=j;q<=end;q++) if(m[q].h > m[B].h) B = q;
    const peak = m[B].h;
    const rsiA = rs[p], rsiB = rs[B];
    const div = rsiA != null && rsiB != null && peak > L && rsiB < rsiA;
    const price = m[n-1].c;
    const out = {id: sym + '_' + (dir === 'long' ? 'L' : 'S') + '_' + m[j].t, sym, price, swingHigh:L, fvgTop:top, fvgBottom:bottom,
      breakT:m[j].t, rsiA, rsiB, div, dist:(price-top)/Math.abs(top)*100};
    if(kc >= 0){
      const ago = n-1-kc;
      if(ago > cfg.confValid) return null;
      const entry = m[kc].c, sl = peak + Math.abs(peak)*0.0005, risk = sl - entry;
      if(risk <= 0) return null;
      return fin(Object.assign(out, {stage:'confirmed', depth:100, confT:m[kc].t + M5, ago, entry, sl, tp:entry - 4*risk}));
    }
    const depth = price >= top ? 0 : Math.min(100, (top-price)/(top-bottom)*100);
    out.depth = depth;
    out.stage = (price <= top || out.dist <= cfg.dev) ? 'developing' : 'watching';
    return fin(out);
  }
  return null;
}

// ===== tracker storage =====
const KEY = 'ifvg_tracker_v1';
const loadT = () => { try{ return JSON.parse(localStorage.getItem(KEY)) || {trades:{}}; }catch(e){ return {trades:{}}; } };
const saveT = T => { try{ localStorage.setItem(KEY, JSON.stringify(T)); }catch(e){} };

function applyScan(found, processed){
  const T = loadT(); let fresh = 0;
  const ids = new Set(found.map(f => f.id));
  for(const s of found){
    if(s.stage === 'watching') continue;                  // watching is not saved
    let r = T.trades[s.id];
    if(!r){ r = T.trades[s.id] = {id:s.id, sym:s.sym, stage:'developing', savedAt:Date.now(), breakT:s.breakT}; }
    if(r.stage === 'win' || r.stage === 'loss') continue;
    r.div = s.div; r.grade = s.div ? 'A+' : 'B'; r.dir = s.dir;
    if(s.stage === 'confirmed' && r.stage !== 'open'){
      Object.assign(r, {stage:'open', entry:s.entry, sl:s.sl, tp:s.tp, confT:s.confT, openedAt:Date.now()});
      fresh++;
    }
  }
  for(const r of Object.values(T.trades)){
    if(r.stage === 'developing' && processed.has(r.sym + '|' + (r.dir || 'short')) && !ids.has(r.id)) r.stage = 'expired';
  }
  saveT(T);
  return fresh;
}

async function resolveOpen(){
  const T = loadT();
  const open = Object.values(T.trades).filter(r => r.stage === 'open');
  if(!open.length) return 0;
  const bySym = {};
  open.forEach(r => (bySym[r.sym] = bySym[r.sym] || []).push(r));
  const outcome = {};
  for(const sym of Object.keys(bySym)){
    let cand;
    try{ cand = await klinesFrom(sym, Math.min(...bySym[sym].map(r => r.confT))); }catch(e){ continue; }
    for(const r of bySym[sym]){
      const long = r.dir === 'long', risk = Math.abs(r.sl - r.entry);
      let mr = 0, stage = 'open', closeT = null;
      for(const c of cand){
        if(c.t < r.confT) continue;
        if(long ? c.l <= r.sl : c.h >= r.sl){ stage = 'loss'; closeT = c.t; break; }   // SL checked first (conservative): this candle's best price is not counted
        mr = Math.max(mr, long ? (c.h - r.entry)/risk : (r.entry - c.l)/risk);
        if(long ? c.h >= r.tp : c.l <= r.tp){ mr = 4; stage = 'win'; closeT = c.t; break; }   // full 1:4 TP
      }
      outcome[r.id] = {stage, maxR:mr, closeT};
    }
  }
  const T2 = loadT(); let n = 0;
  for(const id of Object.keys(outcome)){
    const r = T2.trades[id];
    if(!r || r.stage !== 'open') continue;
    const o = outcome[id];
    r.maxR = o.maxR;
    if(o.stage !== 'open'){ r.stage = o.stage; r.closeT = o.closeT; r.closedAt = Date.now(); n++; }
  }
  saveT(T2);
  return n;
}
const trMax = r => r.maxR != null ? r.maxR : (r.stage === 'win' ? 4 : 0);
const trRes = (r, thr) => { if(!r.entry) return null; if(trMax(r) >= thr) return 'win'; return (r.stage === 'win' || r.stage === 'loss') ? 'loss' : 'open'; };
//--UI--
const $ = id => document.getElementById(id);
const FIELDS = ['coinsSel','swing','breakBy','minVol','lookback','nearTop','devRange','maxAge','confValid','btcGate','biasRule','autoScan','alertOn','winThr','statGrade','statDir','dirSel'];
const getCfg = () => ({
  top:+$('coinsSel').value, swing:+$('swing').value||2, breakBy:$('breakBy').value, minVol:+$('minVol').value||0,
  lookback:+$('lookback').value||50, near:+$('nearTop').value||10, dev:+$('devRange').value||0.3,
  maxAge:+$('maxAge').value||30, confValid:+$('confValid').value||6,
  gate:$('btcGate').checked, rule:$('biasRule').value, dir:$('dirSel').value, alert:$('alertOn').checked
});
function saveSettings(){ const o = {}; FIELDS.forEach(f => o[f] = $(f).type === 'checkbox' ? $(f).checked : $(f).value); try{ localStorage.setItem('ifvg_settings_v1', JSON.stringify(o)); }catch(e){} }
function loadSettings(){ try{ const o = JSON.parse(localStorage.getItem('ifvg_settings_v1')); if(o) FIELDS.forEach(f => { if(f in o){ $(f).type === 'checkbox' ? $(f).checked = o[f] : $(f).value = o[f]; } }); }catch(e){} }

const fp = p => p == null ? '-' : (p >= 1 ? p.toFixed(4) : p.toPrecision(5));
const fT = (t, withDate) => new Date(t*1000).toLocaleString('en-PH', Object.assign({timeZone:'Asia/Manila', hour:'2-digit', minute:'2-digit', hour12:true}, withDate ? {month:'short', day:'numeric'} : {}));

let results = [], tab = 'confirmed', biasText = '-', running = false, timer = null, audio = null;

function beep(){
  try{
    if(!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    const o = audio.createOscillator(), g = audio.createGain();
    o.connect(g); g.connect(audio.destination); o.frequency.value = 880; g.gain.value = 0.15;
    o.start(); o.stop(audio.currentTime + 0.35);
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}

function renderStats(){
  const g = $('statGrade').value, dd = $('statDir').value, thr = +$('winThr').value;
  const T = Object.values(loadT().trades).filter(r => r.entry && (!g || r.grade === g) && (!dd || (r.dir || 'short') === dd));
  const tally = rr => { let w=0, l=0, o=0; T.forEach(r => { const x = trRes(r, rr); x === 'win' ? w++ : x === 'loss' ? l++ : o++; }); return {rr, w, l, o, wr:(w+l) ? w/(w+l)*100 : null, net:w*rr - l}; };
  const cur = tally(thr), rows = [1,2,3,4].map(tally);
  const best = Math.max(...rows.map(x => x.net));
  const col = v => v >= 0 ? '#22c55e' : '#ef4444';
  const decided = T.filter(r => r.stage === 'win' || r.stage === 'loss');
  const avg = decided.length ? decided.reduce((a,r) => a + trMax(r), 0)/decided.length : null;
  $('statsBox').innerHTML = `<div class="stats">
      <span class="pill w">WIN ${cur.w}</span><span class="pill l">LOSS ${cur.l}</span><span class="pill o">OPEN ${cur.o}</span>
      <span class="pill">WR ${cur.wr == null ? '-' : cur.wr.toFixed(0) + '%'}</span>
      <span class="pill" style="color:${col(cur.net)}">${cur.net >= 0 ? '+' : ''}${cur.net}R</span></div>
    <table class="rr"><tr><th>RR</th><th>Win</th><th>Loss</th><th>WR</th><th>Net R</th></tr>
      ${rows.map(x => `<tr class="${x.net === best && (x.w + x.l) > 0 ? 'best' : ''}"><td>1:${x.rr}</td><td>${x.w}</td><td>${x.l}</td><td>${x.wr == null ? '-' : x.wr.toFixed(0) + '%'}</td><td style="color:${col(x.net)}">${x.net >= 0 ? '+' : ''}${x.net}${x.net === best && (x.w + x.l) > 0 ? ' ★' : ''}</td></tr>`).join('')}</table>
    <div class="sub" style="margin-top:6px">WIN = umabot sa hindi bababa sa RR na napili bago tumama ang SL. Ang ★ ang may pinakamataas na Net R. Average na naabot (natapos na): ${avg == null ? '-' : avg.toFixed(2) + 'R'} · ${decided.length} natapos. Sabay na TP at SL sa isang candle = SL muna.</div>`;
}

function setupCard(r){
  const conf = r.stage === 'confirmed', long = r.dir === 'long';
  const tags = [`<span class="tag ${long?'green':'red'}">${long?'LONG':'SHORT'}</span>`, `<span class="tag ${conf?(long?'green':'red'):'yel'}">${conf?'CONFIRMED iFVG':'DEVELOPING'}</span>`];
  if(r.div) tags.splice(1, 0, '<span class="tag pur">DIV · A+</span>');
  return `<div class="card ${r.stage}">
    <div class="hd"><div class="sym">${r.sym.replace('USDT','')}<span>/USDT</span></div><div class="tags">${tags.join('')}</div></div>
    <div class="kv">
      <div>Price <b>${fp(r.price)}</b></div><div>BTC Daily <b>${biasText}</b></div>
      <div>${long?'Swing Low':'Swing High'} <b>${fp(r.swingHigh)}</b></div><div>FVG top <b>${fp(r.fvgTop)}</b></div>
      <div>FVG bottom <b>${fp(r.fvgBottom)}</b></div><div>Distance <b>${r.dist.toFixed(2)}%</b></div>
      <div>Depth sa FVG <b>${r.depth.toFixed(0)}%</b></div><div>Break candle <b>${fT(r.breakT)}</b></div>
      ${conf ? `<div>iFVG confirm <b>${fT(r.confT)}</b></div><div>Entry (ref) <b>${fp(r.entry)}</b></div>
      <div>${long?'SL (below low)':'SL (above high)'} <b>${fp(r.sl)}</b></div><div>TP 1:4 (ref) <b>${fp(r.tp)}</b></div>` : ''}
      <div>RSI14 (A→B) <b>${r.rsiA==null?'-':r.rsiA.toFixed(0)} → ${r.rsiB==null?'-':r.rsiB.toFixed(0)}</b></div>
      <div>Divergence <b style="color:${r.div?'#c4b5fd':'#94a3b8'}">${r.div?(long?'Bullish ✔':'Bearish ✔'):'Wala'}</b></div>
    </div>
    ${conf ? `<div class="note">iFVG confirmed ${r.ago} candle(s) ago · naka-save sa Tracker</div>` : (r.stage==='developing' ? '<div class="note">Naka-save sa Tracker bilang developing</div>' : '')}
    <a class="btn" href="https://www.tradingview.com/chart/?symbol=BINANCE:${r.sym}.P&interval=5" target="_blank">📈 TradingView 5m</a>
  </div>`;
}

function tradeCard(r){
  const thr = +$('winThr').value, x = trRes(r, thr), mr = r.entry ? trMax(r) : null;
  const badge = r.entry
    ? (x === 'win' ? `<span class="tag green">WIN +${thr}R</span>` : x === 'loss' ? '<span class="tag red">LOSS -1R</span>' : '<span class="tag yel">OPEN</span>')
    : (r.stage === 'expired' ? '<span class="tag">EXPIRED</span>' : '<span class="tag">DEVELOPING</span>');
  const cls = r.entry ? (x === 'win' ? 'win' : x === 'loss' ? 'loss' : 'open') : r.stage;
  const end = r.stage === 'win' ? 'TP 1:4 hit' : r.stage === 'loss' ? 'SL hit' : 'Open pa';
  const kv = r.entry ? `<div>Entry <b>${fp(r.entry)}</b></div><div>Confirm <b>${fT(r.confT,true)}</b></div>
      <div>SL <b>${fp(r.sl)}</b></div><div>TP 1:4 <b>${fp(r.tp)}</b></div>
      <div>Max RR naabot <b style="color:${mr >= 1 ? '#22c55e' : '#e5e7eb'}">1:${mr.toFixed(2)}</b></div><div>Katapusan <b>${end}</b></div>
      ${r.closeT ? `<div>Closed <b>${fT(r.closeT,true)}</b></div>` : ''}` :
    `<div>Break candle <b>${fT(r.breakT,true)}</b></div><div>Saved <b>${fT(r.savedAt/1000,true)}</b></div>`;
  return `<div class="card ${cls}">
    <div class="hd"><div class="sym">${r.sym.replace('USDT','')}<span>/USDT</span></div>
      <div class="tags"><span class="tag ${r.dir==='long'?'green':'red'}">${r.dir==='long'?'LONG':'SHORT'}</span>${r.grade ? `<span class="tag ${r.grade==='A+'?'pur':''}">${r.grade}</span>` : ''}${badge}</div></div>
    <div class="kv">${kv}</div>
  </div>`;
}

function render(){
  renderStats();
  const T = Object.values(loadT().trades).sort((a,b) => b.savedAt - a.savedAt);
  const by = st => results.filter(r => r.stage === st);
  const tabs = [['confirmed','Confirmed',by('confirmed').length],['developing','Developing',by('developing').length],
                ['watching','Watching',by('watching').length],['div','DIV',results.filter(r=>r.div).length],['tracker','Tracker',T.length]];
  $('tabs').innerHTML = tabs.map(t => `<button class="tab ${tab===t[0]?'on':''}" data-t="${t[0]}">${t[1]} (${t[2]})</button>`).join('');
  document.querySelectorAll('.tab').forEach(b => b.onclick = () => { tab = b.dataset.t; render(); });
  let html;
  if(tab === 'tracker'){
    html = T.map(tradeCard).join('') || '<div class="empty">Wala pang naka-save.</div>';
    if(T.length) html += '<button class="sec" id="clr" style="width:100%">Burahin lahat ng naka-save</button>';
  }else{
    const rows = tab === 'div' ? results.filter(r => r.div) : by(tab);
    html = rows.map(setupCard).join('') || '<div class="empty">Walang setup dito ngayon.</div>';
  }
  $('list').innerHTML = html;
  const c = $('clr'); if(c) c.onclick = () => { if(confirm('Burahin ang lahat ng naka-save na setup at win/loss?')){ saveT({trades:{}}); render(); } };
}

async function scan(){
  if(running) return; running = true;
  $('go').disabled = true; $('upd').disabled = true; saveSettings();
  const cfg = getCfg(), st = $('status'), pg = $('prog').firstElementChild;
  try{
    let b = null;
    try{ b = await btcBias(cfg.rule); }catch(e){}
    const needBias = cfg.dir === 'auto' || (cfg.gate && cfg.dir !== 'both');
    if(!b && needBias) throw new Error('Hindi makuha ang BTC Daily bias');
    let dirs;
    if(cfg.dir === 'both') dirs = ['short','long'];
    else if(cfg.dir === 'short') dirs = (!cfg.gate || b.state === 'bear') ? ['short'] : [];
    else if(cfg.dir === 'long') dirs = (!cfg.gate || b.state === 'bull') ? ['long'] : [];
    else dirs = b.state === 'bear' ? ['short'] : b.state === 'bull' ? ['long'] : [];
    biasText = b ? {bear:'Bearish', bull:'Bullish', neutral:'Neutral'}[b.state] : 'n/a';
    if(b){
      const ref = cfg.rule === 'low' ? `prev low ${fp(b.p.l)} / prev high ${fp(b.p.h)}` : `prev close ${fp(b.p.c)}`;
      $('biasBox').innerHTML = `<div class="panel" style="border-color:${b.state==='bear'?'#7f1d1d':b.state==='bull'?'#166534':'#713f12'}"><b>BTC Daily: ${biasText.toUpperCase()}${dirs.length ? ' — ' + dirs.map(d => d.toUpperCase()).join(' + ') + ' ang hinahanap' : ' — walang scan'}</b>
        <div class="sub">Last closed Daily close ${fp(b.l.c)} vs ${ref} · Daily closes 8:00 AM PH</div></div>`;
    }else $('biasBox').innerHTML = '';

    if(!dirs.length){
      results = [];
      st.textContent = 'Walang scan: hindi tugma ang BTC Daily bias. Chine-check ang mga open trade...';
      await resolveOpen(); render();
      st.textContent = 'Walang scan: hindi tugma ang BTC Daily bias sa napiling direction.';
      return;
    }

    st.textContent = 'Kinukuha ang listahan ng coins...';
    let uni = (await universe()).filter(u => u.vol >= cfg.minVol).sort((a,b) => b.vol - a.vol);
    if(cfg.top) uni = uni.slice(0, cfg.top);
    const queue = uni.map(u => u.sym), total = queue.length, found = [], processed = new Set();
    let done = 0, errs = 0;
    const worker = async () => {
      while(queue.length){
        const sym = queue.shift();
        try{
          const k5 = await klines(sym, '5m', 300);
          for(const d of dirs){
            const s = detect(sym, k5, cfg, d);
            processed.add(sym + '|' + d);
            if(s) found.push(s);
          }
        }catch(e){ errs++; }
        done++; pg.style.width = (done/total*100) + '%'; st.textContent = `Scanning ${done}/${total}...`;
      }
    };
    await Promise.all(Array.from({length:8}, worker));

    const fresh = applyScan(found, processed);
    const resolved = await resolveOpen();
    const rank = {confirmed:0, developing:1, watching:2};
    results = found.sort((a,b) => rank[a.stage]-rank[b.stage] || (b.div - a.div) || b.breakT - a.breakT);
    st.textContent = `Done ${new Date().toLocaleTimeString('en-PH',{timeZone:'Asia/Manila',hour12:true})} PHT • ${total} coins • ${results.length} setups${errs ? ' • ' + errs + ' failed' : ''}${resolved ? ' • ' + resolved + ' trade natapos' : ''}`;
    render();
    if(cfg.alert && (fresh || resolved)) beep();
  }catch(e){
    st.textContent = 'Error: ' + e.message;
  }finally{
    $('go').disabled = false; $('upd').disabled = false; running = false;
    if($('autoScan').checked) schedule();
  }
}

async function updateOnly(){
  if(running) return; running = true; $('go').disabled = $('upd').disabled = true;
  $('status').textContent = 'Chine-check ang mga open trade...';
  try{ const n = await resolveOpen(); $('status').textContent = n ? n + ' trade ang natapos.' : 'Wala pang tumamang TP o SL.'; }
  catch(e){ $('status').textContent = 'Error: ' + e.message; }
  render(); $('go').disabled = $('upd').disabled = false; running = false;
}

function schedule(){
  clearTimeout(timer);
  const now = Date.now()/1000, next = (Math.floor(now/M5)+1)*M5 + 6;
  timer = setTimeout(scan, (next-now)*1000);
}

loadSettings();
FIELDS.forEach(f => $(f).addEventListener('change', saveSettings));
['winThr','statGrade','statDir'].forEach(f => $(f).addEventListener('change', render));
$('go').onclick = scan; $('upd').onclick = updateOnly;
$('autoScan').addEventListener('change', e => { clearTimeout(timer); if(e.target.checked) schedule(); });
render();
resolveOpen().then(n => { if(n) render(); }).catch(() => {});
</script>
</body>
